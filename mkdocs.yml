site_name: NFX CTF 2026 — Writeup Medium–Hard
site_url: https://fijarsatria.github.io/nfx-ctf-2026-writeups/
site_description: Writeup challenge Medium–Hard NFX CTF 2026, dengan langkah, command, output, dan evidence.
repo_url: https://github.com/Fijarsatria/nfx-ctf-2026-writeups
repo_name: GitHub
edit_uri: ''
copyright: NFX CTF 2026 · Writeup Medium–Hard
docs_dir: docs
site_dir: site
use_directory_urls: false
extra_css:
- stylesheets/extra.css
extra_javascript:
- javascripts/nx.js
theme:
  name: material
  language: id
  logo: assets/nfx-logo.svg
  favicon: assets/nfx-logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
  - scheme: slate
    primary: indigo
    accent: cyan
    toggle:
      icon: material/weather-sunny
      name: Mode terang
  - scheme: default
    primary: indigo
    accent: cyan
    toggle:
      icon: material/weather-night
      name: Mode gelap
  features:
  - navigation.sections
  - navigation.top
  - navigation.tracking
  - navigation.path
  - navigation.indexes
  - toc.follow
  - search.suggest
  - search.highlight
  - content.code.copy
  - content.tabs.link
markdown_extensions:
- admonition
- tables
- toc:
    permalink: true
    toc_depth: 2-3
- pymdownx.superfences
- pymdownx.details
- pymdownx.highlight
- pymdownx.inlinehilite
- pymdownx.tabbed
extra:
  generator: false
